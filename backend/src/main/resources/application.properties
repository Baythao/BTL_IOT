# Doc bien moi truong tu file backend/.env (khong commit file nay)
spring.config.import=optional:file:.env[.properties]

# ===== Database (Supabase) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=5
# Bang da tao san bang SQL -> Hibernate chi kiem tra, khong tu sua bang
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== MQTT =====
mqtt.url=${MQTT_URL:tcp://127.0.0.1:1883}
mqtt.user=${MQTT_USER:firewatch-server}
mqtt.pass=${MQTT_PASS:}

# ===== Admin dau tien (chi tao khi bang users trong) =====
admin.user=${ADMIN_USER:admin}
admin.pass=${ADMIN_PASS:}

# ===== Web =====
server.port=${WEB_PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
# Frontend nam o thu muc rieng BTL_IOT/frontend, backend phuc vu file tinh tu do
spring.web.resources.static-locations=file:${FRONTEND_DIR:../frontend/}
