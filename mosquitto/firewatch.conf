# Example local Mosquitto broker for trusted home/lab Wi-Fi only.
# Plain MQTT port 1883 is NOT TLS encrypted. Do not expose this port to the Internet.
per_listener_settings true
listener 1883 0.0.0.0
allow_anonymous false
password_file C:/ProgramData/MosquittoFireWatch/passwd
acl_file C:/ProgramData/MosquittoFireWatch/aclfile
persistence false
log_dest stdout
